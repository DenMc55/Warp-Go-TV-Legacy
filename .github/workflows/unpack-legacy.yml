name: Unpack Legacy Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract legacy source
        run: |
          mkdir -p /tmp/legacy
          unzip -q "Warp-Go-TV-main.1.5.70.legacy.zip" -d /tmp/legacy

          SOURCE_DIR=$(find /tmp/legacy -mindepth 1 -maxdepth 1 -type d | head -n 1)

          echo "Source folder: $SOURCE_DIR"

                    rsync -av \
            --exclude='.git' \
            --exclude='.github/workflows' \
            --exclude='Warp-Go-TV-main.1.5.70.legacy.zip' \
            "$SOURCE_DIR/" ./

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Import working v1.5.70 legacy source" || exit 0
          git push
